name: Protecio team preview

on:
  workflow_dispatch:

concurrency:
  group: protecio-team-preview
  cancel-in-progress: false

permissions: {}

jobs:
  windows:
    name: Build Windows team preview
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      TARGET: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          targets: ${{ env.TARGET }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.14.1
          package-manager-cache: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11.4.0

      - name: Install dependencies
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Build sidecars
        shell: bash
        run: |
          cargo build --release --target "$TARGET" \
            -p buzz-acp \
            -p buzz-agent \
            -p buzz-dev-mcp \
            -p git-credential-nostr \
            -p buzz-cli
          ./scripts/bundle-sidecars.sh "$TARGET"

      - name: Build unsigned Windows installer
        shell: bash
        run: >-
          cd desktop &&
          pnpm tauri build
          --verbose
          --target "$TARGET"
          --bundles nsis
        env:
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"

      - name: Locate installer and generate checksum
        id: artifact
        shell: bash
        run: |
          BUNDLE_DIR="desktop/src-tauri/target/${TARGET}/release/bundle/nsis"
          EXE=$(find "$BUNDLE_DIR" -name '*.exe' -type f | head -1)
          if [[ -z "$EXE" ]]; then
            echo "::error::No NSIS installer found in $BUNDLE_DIR"
            exit 1
          fi
          TARGET_EXE="$RUNNER_TEMP/Protecio-Buzz-Windows-preview-unsigned.exe"
          cp "$EXE" "$TARGET_EXE"
          (cd "$RUNNER_TEMP" && sha256sum "$(basename "$TARGET_EXE")" > "$(basename "$TARGET_EXE").sha256")
          echo "exe=$TARGET_EXE" >> "$GITHUB_OUTPUT"
          echo "checksum=${TARGET_EXE}.sha256" >> "$GITHUB_OUTPUT"

      - name: Publish private-team draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXE: ${{ steps.artifact.outputs.exe }}
          CHECKSUM: ${{ steps.artifact.outputs.checksum }}
        run: |
          TAG="protecio-team-preview"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --draft \
              --prerelease \
              --title "Protecio Buzz · préversion équipe" \
              --notes "Préversion Windows non signée réservée aux collaborateurs Protecio. Microsoft Defender peut afficher un avertissement jusqu’à la signature du binaire."
          else
            gh release create "$TAG" \
              --draft \
              --prerelease \
              --target "$GITHUB_SHA" \
              --title "Protecio Buzz · préversion équipe" \
              --notes "Préversion Windows non signée réservée aux collaborateurs Protecio. Microsoft Defender peut afficher un avertissement jusqu’à la signature du binaire."
          fi
          gh release upload "$TAG" "$EXE" "$CHECKSUM" --clobber
